<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Foldr — PDF tools that stay on your device</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.2/mammoth.browser.min.js"></script>
<style>
:root{--bg:#F3F5F9;--sf:rgba(255,255,255,.72);--bd:rgba(15,23,42,.1);--tx:#0F172A;--mu:#64748B;--ac:#4F46E5;--sh:0 1px 2px rgba(15,23,42,.05),0 8px 24px -12px rgba(15,23,42,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#090B10;--sf:rgba(22,26,36,.7);--bd:rgba(255,255,255,.09);--tx:#EEF1F7;--mu:#8B95A8;--ac:#8B8CFF;--sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6)}}
:root[data-theme="dark"]{--bg:#090B10;--sf:rgba(22,26,36,.7);--bd:rgba(255,255,255,.09);--tx:#EEF1F7;--mu:#8B95A8;--ac:#8B8CFF;--sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Plus Jakarta Sans",system-ui,sans-serif;min-height:100vh}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;gap:12px;align-items:center;padding:12px clamp(14px,4vw,32px);background:var(--sf);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.logo{font-weight:800;font-size:19px;letter-spacing:-.03em;cursor:pointer;display:flex;gap:8px;align-items:center;white-space:nowrap}
.logo i{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--ac),#E5484D);display:inline-block}
#q{flex:1;min-width:0;max-width:420px;margin:0 auto;padding:9px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--sf)}
.ib{border:1px solid var(--bd);background:var(--sf);border-radius:12px;width:38px;height:38px}
main{max-width:1120px;margin:0 auto;padding:clamp(18px,4vw,40px) clamp(14px,4vw,32px) 60px}
h1{font-size:clamp(30px,6vw,54px);line-height:1.04;letter-spacing:-.04em;margin:8px 0 10px;font-weight:800;max-width:14ch}
.sub{color:var(--mu);max-width:52ch;margin:0 0 28px}
.ad{display:flex;align-items:center;justify-content:center;border:1px dashed var(--bd);border-radius:12px;color:var(--mu);font-size:12px;margin:22px auto;max-width:100%}
.cat{margin:30px 0 12px;font-size:17px;font-weight:700;letter-spacing:-.01em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{--c:var(--ac);text-align:left;display:flex;gap:12px;padding:14px;border:1px solid var(--bd);border-radius:16px;background:var(--sf);box-shadow:var(--sh);transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--c) 50%,transparent)}
.ico{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:19px;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent)}
.card b{display:block;font-size:14.5px}.card span.d{display:block;color:var(--mu);font-size:12.5px;line-height:1.35}
.soon{opacity:.55}.tag{font-size:11px;color:var(--mu);border:1px solid var(--bd);border-radius:6px;padding:0 6px;margin-left:6px;font-weight:500}
.ws{display:grid;grid-template-columns:1fr 320px;gap:18px;align-items:start}
@media(max-width:820px){.ws{grid-template-columns:1fr}}
.panel{border:1px solid var(--bd);border-radius:18px;background:var(--sf);padding:16px;box-shadow:var(--sh)}
.drop{border:2px dashed color-mix(in srgb,var(--c) 45%,transparent);border-radius:18px;padding:34px 16px;text-align:center;background:color-mix(in srgb,var(--c) 6%,transparent);transition:.15s}
.drop.on{background:color-mix(in srgb,var(--c) 16%,transparent);transform:scale(1.01)}
.btn{border:0;border-radius:12px;padding:11px 18px;background:var(--c,var(--ac));color:#fff;font-weight:700}
.btn.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}.btn:disabled{opacity:.5;cursor:default}
.files{display:grid;gap:8px;margin-top:14px}
.f{display:flex;gap:10px;align-items:center;padding:8px;border:1px solid var(--bd);border-radius:12px;background:var(--sf)}
.f canvas,.f img,.f .ph{width:44px;height:56px;object-fit:cover;border-radius:6px;background:var(--bd);flex:none}
.f .n{flex:1;min-width:0}.f .n b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px}.f .n small{color:var(--mu)}
.f button{border:1px solid var(--bd);background:transparent;border-radius:8px;width:30px;height:30px}
label.o{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}
.panel input[type=text],.panel input[type=number],.panel select{width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--bd);background:var(--bg)}
.bar{height:6px;border-radius:6px;background:var(--bd);overflow:hidden;margin-top:14px;display:none}.bar i{display:block;height:100%;width:0;background:var(--c);transition:width .2s}
.res{margin-top:14px;padding:12px;border-radius:12px;background:color-mix(in srgb,#30A46C 14%,transparent);display:none}
.res a{display:inline-block;margin:6px 8px 0 0;text-decoration:none}
#toasts{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;z-index:30}
.t{padding:11px 15px;border-radius:12px;background:var(--tx);color:var(--bg);font-size:13.5px;box-shadow:var(--sh);max-width:300px;animation:in .2s}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.priv{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--mu);border:1px solid var(--bd);border-radius:99px;padding:3px 11px;background:var(--sf)}
</style>
</head>
<body>
<header>
  <div class="logo" onclick="home()"><i></i>Foldr</div>
  <input id="q" type="search" placeholder="Search tools" aria-label="Search tools">
  <button class="ib" id="th" aria-label="Toggle theme">◐</button>
</header>
<main id="app"></main>
<div id="toasts"></div>
<script>
const {PDFDocument,degrees,rgb,StandardFonts}=PDFLib;
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const $=s=>document.querySelector(s);
const C={org:['Organize PDF','#E5484D'],opt:['Optimize PDF','#30A46C'],to:['Convert to PDF','#3E63DD'],from:['Convert from PDF','#F76B15'],edit:['Edit PDF','#8E4EC6'],sec:['PDF security','#5B6B8C']};

const T=[
{id:'merge',c:'org',n:'Merge PDF',d:'Combine PDFs in the order you set',g:'⧉',a:PDF,m:1,ok:1},
{id:'split',c:'org',n:'Split PDF',d:'Cut by ranges or one file per page',g:'✂',a:PDF,ok:1,o:[sel('mode','Mode',[['burst','Every page as its own file'],['ranges','Custom ranges']],'burst'),txt('r','Ranges (1-3,5,8-10)','1-2')]},
{id:'remove',c:'org',n:'Remove pages',d:'Delete the pages you list',g:'⌫',a:PDF,ok:1,o:[txt('r','Pages to remove','2')]},
{id:'extract',c:'org',n:'Extract pages',d:'Keep only the pages you list',g:'⇱',a:PDF,ok:1,o:[txt('r','Pages to keep','1-3')]},
{id:'organize',c:'org',n:'Organize PDF',d:'Reorder, duplicate, delete and rotate pages',g:'▦',a:PDF,ok:1,o:[txt('r','New page order (e.g. 3,1,2,2). Skip a page to delete it.',''),sel('deg','Rotate all pages',[['0','No rotation'],['90','90°'],['180','180°'],['270','270°']],'0')]},{id:'scan',c:'org',n:'Scan to PDF',d:'Camera capture to PDF',g:'◉'},
{id:'compress',c:'opt',n:'Compress PDF',d:'Shrink size by re-encoding pages',g:'⇲',a:PDF,ok:1,o:[sel('q','Quality',[['.8','High'],['.6','Balanced'],['.4','Smallest']],'.6')]},
{id:'img2pdf',c:'to',n:'Images to PDF',d:'JPG, PNG and more into one PDF',g:'▣',a:IMG,m:1,ok:1,o:[sel('size','Page size',[['a4','A4'],['letter','Letter'],['fit','Fit to image']],'a4'),sel('ori','Orientation',[['p','Portrait'],['l','Landscape']],'p'),num('mar','Margin (pt)',24)]},
{id:'word2pdf',c:'to',n:'Word to PDF',d:'.docx text to PDF',g:'W',a:'.docx',ok:1},{id:'ppt2pdf',c:'to',n:'PowerPoint to PDF',d:'.pptx to PDF',g:'P'},{id:'xls2pdf',c:'to',n:'Excel to PDF',d:'Sheets to paginated PDF tables',g:'X',a:'.xlsx,.xls,.csv',ok:1},{id:'html2pdf',c:'to',n:'HTML / text to PDF',d:'HTML, Markdown or .txt to PDF',g:'‹›',a:'.html,.htm,.md,.txt',ok:1},
{id:'pdf2img',c:'from',n:'PDF to JPG',d:'Every page as an image, zipped',g:'⇪',a:PDF,ok:1,o:[sel('fmt','Format',[['jpeg','JPG'],['png','PNG']],'jpeg'),sel('s','Resolution',[['1.5','Standard'],['2.5','High']],'2')]},
{id:'pdf2word',c:'from',n:'PDF to Word',d:'Extract text into an editable .docx',g:'W',a:PDF,ok:1},{id:'pdf2ppt',c:'from',n:'PDF to PowerPoint',d:'Pages as slides',g:'P'},{id:'pdf2xls',c:'from',n:'PDF to Excel',d:'Text rows and columns to .xlsx',g:'X',a:PDF,ok:1},{id:'pdfa',c:'from',n:'PDF to PDF/A',d:'Archive format',g:'A'},
{id:'rotate',c:'edit',n:'Rotate PDF',d:'Turn all or chosen pages',g:'↻',a:PDF,ok:1,o:[sel('deg','Rotate',[['90','90° clockwise'],['180','180°'],['270','90° counter-clockwise']],'90'),txt('r','Pages (blank = all)','')]},
{id:'numbers',c:'edit',n:'Add page numbers',d:'Pick position and size',g:'#',a:PDF,ok:1,o:[sel('pos','Position',[['br','Bottom right'],['bc','Bottom center'],['bl','Bottom left'],['tr','Top right'],['tc','Top center']],'bc'),num('sz','Font size',11)]},
{id:'wm',c:'edit',n:'Add watermark',d:'Text across every page',g:'◈',a:PDF,ok:1,o:[txt('t','Watermark text','CONFIDENTIAL'),num('op','Opacity (0.05–1)',.2),num('rot','Rotation (°)',45)]},
{id:'crop',c:'edit',n:'Crop PDF',d:'Trim margins on every page',g:'⛶',a:PDF,ok:1,o:[num('t','Trim top (pt)',0),num('r','Trim right (pt)',0),num('b','Trim bottom (pt)',0),num('l','Trim left (pt)',0)]},{id:'edit',c:'edit',n:'Edit PDF',d:'Text, shapes, drawings',g:'✎'},{id:'forms',c:'edit',n:'PDF forms',d:'Fill and sign',g:'✍'},
{id:'unlock',c:'sec',n:'Unlock PDF',d:'Remove a known password',g:'🔓'},{id:'protect',c:'sec',n:'Protect PDF',d:'Add a password',g:'🔒'}
];
const toast=m=>{const e=document.createElement('div');e.className='t';e.textContent=m;$('#toasts').append(e);setTimeout(()=>e.remove(),4200)};
const fmt=b=>b>1e6?(b/1e6).toFixed(2)+' MB':Math.max(1,Math.round(b/1e3))+' KB';
const ad=(w,h)=>`<div class="ad" style="width:${w}px;height:${h}px">Ad ${w}×${h}</div>`;
function home(){
 cur=null;const q=($('#q').value||'').toLowerCase();
 let h=`<span class="priv">🔒 Files never leave your browser</span><h1>Every PDF tool, on your device</h1><p class="sub">Merge, split, compress, convert and mark up PDFs. Nothing is uploaded, so it works offline once loaded.</p>${ad(728,90)}`;
 for(const k in C){const L=T.filter(t=>t.c==k&&(t.n+t.d).toLowerCase().includes(q));if(!L.length)continue;
  h+=`<h2 class="cat">${C[k][0]}</h2><div class="grid">`+L.map(t=>`<button class="card ${t.ok?'':'soon'}" style="--c:${C[k][1]}" onclick="openT('${t.id}')"><div class="ico">${t.g}</div><div><b>${t.n}${t.ok?'':'<em class="tag">Soon</em>'}</b><span class="d">${t.d}</span></div></button>`).join('')+'</div>'}
 $('#app').innerHTML=h;
}
let cur=null,files=[];
function openT(id){
 const t=T.find(x=>x.id==id);if(!t.ok)return toast(t.n+' needs a heavier engine and is not in this build yet.');
 cur=t;files=[];const col=C[t.c][1];
 $('#app').innerHTML=`<div style="--c:${col}"><button class="btn g" onclick="home()">← All tools</button><h1 style="font-size:clamp(26px,5vw,40px);max-width:none;margin-top:16px">${t.n}</h1><p class="sub">${t.d}. Processed locally.</p>
 <div class="ws"><div><label class="drop" id="dz" style="display:block;cursor:pointer"><div style="font-size:30px">⇧</div><b>Drop ${t.a==IMG?'images':t.a==PDF?'PDF files':'files'} here</b><div class="sub" style="margin:4px 0 14px">or choose from your device</div><span class="btn">Choose ${t.m?'files':'file'}</span><input id="fi" type="file" hidden accept="${t.a}" ${t.m?'multiple':''}></label><div class="files" id="fl"></div>${ad(300,250)}</div>
 <div class="panel"><b>Settings</b>${(t.o||[]).map(o=>`<label class="o">${o.l}</label>`+(o.t=='s'?`<select data-k="${o.k}">${o.o.map(v=>`<option value="${v[0]}" ${v[0]==o.d?'selected':''}>${v[1]}</option>`).join('')}</select>`:`<input data-k="${o.k}" type="${o.t=='n'?'number':'text'}" step="any" value="${o.d}">`)).join('')||'<p class="sub" style="margin:8px 0 0">No settings needed.</p>'}
 <button class="btn" id="go" style="width:100%;margin-top:18px" disabled>${t.n}</button><div class="bar" id="bar"><i></i></div><div class="res" id="res"></div></div></div></div>`;
 const dz=$('#dz'),fi=$('#fi');fi.onchange=()=>{add([...fi.files]);fi.value=''};
 ['dragover','dragenter'].forEach(e=>dz.addEventListener(e,x=>{x.preventDefault();dz.classList.add('on')}));
 ['dragleave','drop'].forEach(e=>dz.addEventListener(e,x=>{x.preventDefault();dz.classList.remove('on')}));
 dz.addEventListener('drop',x=>add([...x.dataTransfer.files]));$('#go').onclick=run;
}
async function add(list){
 for(const f of list){
  const isP=/pdf$/i.test(f.type)||/\.pdf$/i.test(f.name);
  if(cur.a==PDF&&!isP){toast(`"${f.name}" is not a PDF`);continue}
  if(cur.a==IMG&&!f.type.startsWith('image/')){toast(`"${f.name}" is not an image`);continue}
  if(cur.a!=PDF&&cur.a!=IMG&&!cur.a.split(',').some(x=>f.name.toLowerCase().endsWith(x))){toast(`"${f.name}" is not supported here (use ${cur.a})`);continue}
  const e={f};
  try{
   if(isP){const buf=await f.arrayBuffer();const d=await pdfjsLib.getDocument({data:new Uint8Array(buf.slice(0))}).promise;e.pages=d.numPages;
    const p=await d.getPage(1),v=p.getViewport({scale:.35}),c=document.createElement('canvas');c.width=v.width;c.height=v.height;await p.render({canvasContext:c.getContext('2d'),viewport:v}).promise;e.th=c}
   else if(f.type.startsWith('image/'))e.url=URL.createObjectURL(f)
  }catch(err){(console.error(err),toast(err.name=='PasswordException'?`"${f.name}" is password protected`:err.name=='InvalidPDFException'?`"${f.name}" looks corrupted`:`Could not read "${f.name}": ${err.message||err.name}`));continue}
  if(!cur.m)files=[];files.push(e);
 }
 draw();
}
function draw(){
 const L=$('#fl');L.innerHTML='';
 files.forEach((e,i)=>{const r=document.createElement('div');r.className='f';
  const th=e.th?e.th:e.url?Object.assign(document.createElement('img'),{src:e.url}):Object.assign(document.createElement('div'),{className:'ph'});
  r.append(th);const n=document.createElement('div');n.className='n';n.innerHTML=`<b></b><small>${fmt(e.f.size)}${e.pages?' · '+e.pages+' pages':''}</small>`;n.querySelector('b').textContent=e.f.name;r.append(n);
  if(cur.m&&files.length>1)[['↑',-1],['↓',1]].forEach(([s,d])=>{const b=document.createElement('button');b.textContent=s;b.setAttribute('aria-label','Move '+(d<0?'up':'down'));b.onclick=()=>{const j=i+d;if(j<0||j>=files.length)return;[files[i],files[j]]=[files[j],files[i]];draw()};r.append(b)});
  const x=document.createElement('button');x.textContent='✕';x.setAttribute('aria-label','Remove');x.onclick=()=>{files.splice(i,1);draw()};r.append(x);L.append(r)});

}
const rng=(s,n)=>{const S=new Set();s.split(',').forEach(p=>{p=p.trim();if(!p)return;const m=p.match(/^(\d+)(?:-(\d+))?$/);if(!m)throw Error(`Invalid range "${p}"`);const a=+m[1],b=+(m[2]||m[1]);if(a<1||b>n||a>b)throw Error(`Pages must be between 1 and ${n}`);for(let i=a;i<=b;i++)S.add(i-1)});return[...S].sort((a,b)=>a-b)};
const save=async d=>new Blob([await d.save()],{type:'application/pdf'});
const load=async f=>{try{return await PDFDocument.load(await f.arrayBuffer())}catch(e){throw Error(`"${f.name}" is encrypted or corrupted`)}};
const base=f=>f.name.replace(/\.[^.]+$/,'');
const pdfjsDoc=async f=>pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;
const toCanvas=async(pg,s)=>{const v=pg.getViewport({scale:s}),c=document.createElement('canvas');c.width=v.width;c.height=v.height;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);await pg.render({canvasContext:x,viewport:v}).promise;return c};
const blobOf=(c,t,q)=>new Promise(r=>c.toBlob(r,t,q));
const copy=async(src,idx)=>{const o=await PDFDocument.create();(await o.copyPages(src,idx)).forEach(p=>o.addPage(p));return o};
const san=s=>s.replace(/\r/g,'').replace(/\t/g,'    ').replace(/[^\n\x20-\x7E\xA0-\xFF]/g,'?');
async function textPdf(text){const d=await PDFDocument.create(),ft=await d.embedFont(StandardFonts.Helvetica),W=595,H=842,m=50,z=11;let pg=d.addPage([W,H]),y=H-m;
 for(const raw of san(text).split('\n')){let line='';const out=[];for(const w of raw.split(' ')){const t=line?line+' '+w:w;if(ft.widthOfTextAtSize(t,z)>W-2*m&&line){out.push(line);line=w}else line=t}out.push(line);
  for(const l of out){if(y<m+z){pg=d.addPage([W,H]);y=H-m}pg.drawText(l,{x:m,y:y-z,size:z,font:ft});y-=15}}return d}
async function rowsOf(pg){const tc=await pg.getTextContent(),L=[];tc.items.forEach(it=>{if(!it.str.trim())return;const y=Math.round(it.transform[5]);let l=L.find(l=>Math.abs(l.y-y)<=3);if(!l)L.push(l={y,i:[]});l.i.push(it)});return L.sort((a,b)=>b.y-a.y).map(l=>l.i.sort((a,b)=>a.transform[4]-b.transform[4]))}
const lineText=I=>{let s='',e=null;I.forEach(x=>{const xs=x.transform[4];if(e!==null&&xs-e>2&&!s.endsWith(' ')&&!x.str.startsWith(' '))s+=' ';s+=x.str;e=xs+x.width});return s};
const cellsOf=I=>{const c=[];let e=null,t='';I.forEach(x=>{const xs=x.transform[4];if(e!==null&&xs-e>12){c.push(t.trim());t=''}t+=x.str;e=xs+x.width});c.push(t.trim());return c};
const noText='No selectable text found. This looks like a scanned PDF.';
const ACT={
async merge(F,o,p){const out=await PDFDocument.create();for(let i=0;i<F.length;i++){const d=await load(F[i].f);(await out.copyPages(d,d.getPageIndices())).forEach(x=>out.addPage(x));p((i+1)/F.length)}return[{n:'merged.pdf',b:await save(out)}]},
async split(F,o,p){const f=F[0].f,d=await load(f),n=d.getPageCount(),R=[];
 if(o.mode=='burst')for(let i=0;i<n;i++){R.push({n:`${base(f)}-p${i+1}.pdf`,b:await save(await copy(d,[i]))});p((i+1)/n)}
 else{const parts=o.r.split(',').filter(s=>s.trim());if(!parts.length)throw Error('Enter at least one range');for(const s of parts){R.push({n:`${base(f)}-${s.trim()}.pdf`,b:await save(await copy(d,rng(s,n)))})}}return R},
async remove(F,o){const d=await load(F[0].f),n=d.getPageCount(),del=rng(o.r,n);if(del.length>=n)throw Error('You cannot remove every page');return[{n:base(F[0].f)+'-trimmed.pdf',b:await save(await copy(d,d.getPageIndices().filter(i=>!del.includes(i))))}]},

async numbers(F,o,p){const d=await load(F[0].f),ft=await d.embedFont(StandardFonts.Helvetica),n=d.getPageCount(),z=+o.sz||11;
 d.getPages().forEach((pg,i)=>{const{width:w,height:h}=pg.getSize(),t=`${i+1} / ${n}`,tw=ft.widthOfTextAtSize(t,z),m=28,x=o.pos.endsWith('l')?m:o.pos.endsWith('r')?w-m-tw:(w-tw)/2,y=o.pos[0]=='t'?h-m:m-4;pg.drawText(t,{x,y,size:z,font:ft,color:rgb(.2,.2,.25)});p((i+1)/n)});return[{n:base(F[0].f)+'-numbered.pdf',b:await save(d)}]},
async wm(F,o,p){if(!o.t.trim())throw Error('Enter watermark text');const d=await load(F[0].f),ft=await d.embedFont(StandardFonts.HelveticaBold),a=+o.rot||0,op=Math.min(1,Math.max(.05,+o.op||.2));
 d.getPages().forEach((pg,i)=>{const{width:w,height:h}=pg.getSize(),z=Math.min(w,h)/(o.t.length*.55||1)*1.1,tw=ft.widthOfTextAtSize(o.t,z),r=a*Math.PI/180;

async img2pdf(F,o,p){const out=await PDFDocument.create(),sz={a4:[595,842],letter:[612,792]},mar=+o.mar||0;
 for(let i=0;i<F.length;i++){const f=F[i].f;let bytes=new Uint8Array(await f.arrayBuffer()),im;
  try{im=f.type=='image/jpeg'?await out.embedJpg(bytes):f.type=='image/png'?await out.embedPng(bytes):null}catch(e){im=null}

async pdf2img(F,o,p){const d=await pdfjsDoc(F[0].f),R=[],ext=o.fmt=='jpeg'?'jpg':'png';for(let i=1;i<=d.numPages;i++){const c=await toCanvas(await d.getPage(i),+o.s);R.push({n:`${base(F[0].f)}-p${i}.${ext}`,b:await blobOf(c,'image/'+o.fmt,.92)});p(i/d.numPages)}return R},

async organize(F,o){const d=await load(F[0].f),n=d.getPageCount(),ord=o.r.split(',').map(x=>+x.trim()).filter(Boolean);if(!ord.length||ord.some(i=>!Number.isInteger(i)||i<1||i>n))throw Error(`Enter page numbers from 1 to ${n}, like 3,1,2,2`);const out=await copy(d,ord.map(i=>i-1));if(+o.deg)out.getPages().forEach(pg=>pg.setRotation(degrees((pg.getRotation().angle+ +o.deg)%360)));return[{n:base(F[0].f)+'-organized.pdf',b:await save(out)}]},
async crop(F,o){const d=await load(F[0].f),t=+o.t||0,r=+o.r||0,b=+o.b||0,l=+o.l||0;d.getPages().forEach(pg=>{const{width:w,height:h}=pg.getSize();if(l+r>=w||t+b>=h)throw Error('Crop is larger than the page');pg.setCropBox(l,b,w-l-r,h-t-b)});return[{n:base(F[0].f)+'-cropped.pdf',b:await save(d)}]},
async word2pdf(F){if(!window.mammoth)throw Error('Word engine failed to load. Check your connection.');const r=await mammoth.extractRawText({arrayBuffer:await F[0].f.arrayBuffer()}).catch(()=>{throw Error('Could not read this .docx file')});if(!r.value.trim())throw Error('This document has no text');return[{n:base(F[0].f)+'.pdf',b:await save(await textPdf(r.value)),note:'Text and paragraphs are kept. Images and complex styling are not.'}]},
async html2pdf(F){const s=await F[0].f.text();let t=s;if(/\.html?$/i.test(F[0].f.name)){const doc=new DOMParser().parseFromString(s,'text/html');doc.querySelectorAll('script,style').forEach(e=>e.remove());doc.body.querySelectorAll('br,p,div,li,tr,h1,h2,h3,h4,h5,h6').forEach(e=>e.append('\n'));t=doc.body.textContent.replace(/\n{3,}/g,'\n\n')}if(!t.trim())throw Error('This file is empty');return[{n:base(F[0].f)+'.pdf',b:await save(await textPdf(t)),note:'Converted as plain text. Styling is not kept.'}]},
async xls2pdf(F,o,p){if(!window.XLSX)throw Error('Spreadsheet engine failed to load. Check your connection.');const wb=XLSX.read(await F[0].f.arrayBuffer(),{type:'array'}),d=await PDFDocument.create(),ft=await d.embedFont(StandardFonts.Helvetica),fb=await d.embedFont(StandardFonts.HelveticaBold),W=842,H=595,m=30,z=8,rh=14;

  const nc=Math.max(...rows.map(r=>r.length)),cw=Array.from({length:nc},(_,c)=>Math.min(160,Math.max(30,Math.max(...rows.map(r=>String(r[c]??'').length))*4.6+10))),tot=cw.reduce((a,b)=>a+b,0),k=Math.min(1,(W-2*m)/tot);

  rows.forEach((r,ri)=>{if(y<m+rh)np();let x=m;cw.forEach((w0,c)=>{const w=w0*k;let t=san(String(r[c]??''));while(t.length&&ft.widthOfTextAtSize(t,z)>w-6)t=t.slice(0,-1);if(ri==0)pg.drawRectangle({x,y:y-rh+3,width:w,height:rh,color:rgb(.93,.94,.97)});pg.drawText(t,{x:x+3,y:y-rh+6,size:z,font:ri?ft:fb});x+=w});pg.drawLine({start:{x:m,y:y-rh+3},end:{x:m+tot*k,y:y-rh+3},thickness:.4,color:rgb(.8,.82,.86)});y-=rh})});

async pdf2word(F,o,p){const d=await pdfjsDoc(F[0].f),esc=s=>s.replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])),ps=[];let tot=0;
